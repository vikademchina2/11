<script type="text/babel">
const {useState,useEffect,useRef}=React;
const DATA=JSON.parse(document.getElementById("data").textContent);
const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const MAPS={};["XX-2","I-1","I-2","I-3","I-4","VII-1","II-4"].forEach(k=>{const e=document.getElementById("svg-"+k);if(e)MAPS[k]=e.textContent}); // ключ: корпус-поверх
const LAT={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e"}; // кирилиця → латиниця для номерів аудиторій
const norm=s=>s.toLowerCase().replace(/\s/g,"").replace(/['’`*]/g,"*").replace(/[а-яіїєґ]/g,c=>LAT[c]||c);
const IDX={};
function findRoom(k,r){const m=MAPS[k];if(!m||!r)return null; // повертає id аудиторії в SVG (без room_), однаково для 015а і 015a
  if(!IDX[k]){IDX[k]={};for(const x of m.matchAll(/id="room_([^"]*)"/g)){const id=x[1].replace(/&#39;/g,"'"),n=norm(id);IDX[k][n]=IDX[k][n]||id}}
  return IDX[k][norm(r)]||null}
const TYPE_CLR={"Лекція":"#a78bfa","Практична":"#fbbf24","Лабораторна":"#34d399"};
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};

/* ---------- API-шар: заміни на реальний запит ---------- */
const api={
  getSchedule:(g)=>new Promise(res=>setTimeout(()=>res(DATA.schedules[g.id]||mock(g.id)),150))
};
function mock(seed){ // реалістичні заглушки для решти груп
  let x=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0);const r=n=>(x=(x*9301+49297)%233280)%n;
  const sub=["Програмування","Математичний аналіз","Фізика","Англійська мова","Основи комп’ютерної логіки","Філософія"];
  const T=["Лекція","Практична","Лабораторна"];const rooms=["214","205","216а","217","218","224","211"];
  const out=[];for(let d=0;d<5;d++)for(let p=1;p<=3+r(2);p++)if(r(4)>0)out.push({day:d,pair:p,week:"both",sub:0,title:sub[r(sub.length)],teacher:"Викладач "+(1+r(9))+".",type:T[r(3)],building:r(3)?"XX":"I",room:r(3)?rooms[r(rooms.length)]:String(100+r(300))});
  return out;
}

const Icon=({d,c="w-4 h-4"})=><svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{d}</svg>;
const I={pin:<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,back:<path d="m15 18-6-6 6-6"/>,x:<path d="M18 6 6 18M6 6l12 12"/>,clock:<><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></>};

function Header({title,sub,onBack}){return <header className="px-4 pt-5 pb-3 max-w-3xl mx-auto">
  {onBack&&<button onClick={onBack} className="flex items-center gap-1 text-sm mb-3" style={{color:"var(--mu)"}}><Icon d={I.back}/>Назад</button>}
  <h1 className="hd text-2xl sm:text-3xl font-bold">{title}</h1>{sub&&<p className="mt-1" style={{color:"var(--mu)"}}>{sub}</p>}</header>}

function Home({onPick}){return <><Header title="Розклад ІКНІ" sub="Оберіть кафедру"/>
  <main className="px-4 pb-24 max-w-5xl mx-auto grid gap-3 grid-cols-2 sm:grid-cols-3 lg:grid-cols-4">
  {DATA.departments.map(d=><button key={d.id} onClick={()=>onPick(d)} className="card p-4 text-left">
    <div className="hd text-xl font-bold" style={{color:d.vr?"var(--ac)":"var(--tx)"}}>{d.short}</div>
    <div className="mt-1 text-sm" style={{color:"var(--mu)"}}>{d.name}</div>
    <div className="mt-3 text-sm">{d.groups.length} гр.{d.vr&&" · карти"}</div></button>)}</main></>}

function Groups({dept,onPick,onBack}){return <><Header title={dept.short} sub={dept.name+" · 1 курс"} onBack={onBack}/>
  <main className="px-4 pb-24 max-w-3xl mx-auto grid gap-3 grid-cols-2 sm:grid-cols-3">
  {dept.groups.map(g=><button key={g} onClick={()=>onPick({id:g,maps:!!dept.vr})} className="card p-4 text-left">
    <div className="hd text-xl font-bold">{g}</div>{dept.vr&&<div className="mt-1 text-xs" style={{color:"var(--nw)"}}>є карта аудиторій</div>}</button>)}</main></>}

function Lesson({l,group,now,onMap}){
  const p=DATA.pairs[l.pair-1],s=toMin(p.s),e=toMin(p.e);
  const live=now.day===l.day&&now.min>=s&&now.min<e&&(l.week==="both"||l.week===now.week);
  const pct=live?Math.round((now.min-s)/(e-s)*100):0;
  const clean=l.room.replace(/\s/g,""),digits=clean.replace(/\D/g,""),floor=/['’`*]/.test(clean)?String(+digits.charAt(0)+1):digits.charAt(0)==="0"?"1":digits.charAt(0); // 319' / 319* = аудиторія наступного поверху
  const mk=MAPS[l.building+"-"+floor];
  const k=l.building+"-"+floor,roomId=findRoom(k,clean)||findRoom(k,digits);
  const hasMap=group.maps&&!!roomId;
  return <li className="card p-3 flex gap-3" style={live?{borderColor:"var(--nw)",boxShadow:"0 0 0 2px var(--nw)"}:{}}>
    <div className="w-14 shrink-0 text-center"><div className="hd text-lg font-bold">{l.pair}</div><div className="text-xs" style={{color:"var(--mu)"}}>{p.s}<br/>{p.e}</div></div>
    <div className="min-w-0 flex-1">
      <div className="flex flex-wrap items-center gap-2 mb-1">
        <span className="text-xs px-2 py-0.5 rounded-full" style={{background:TYPE_CLR[l.type]+"22",color:TYPE_CLR[l.type]}}>{l.type}</span>
        {l.sub>0&&<span className="text-xs px-2 py-0.5 rounded-full border" style={{borderColor:"var(--bd)",color:"var(--mu)"}}>{l.sub} підгрупа</span>}
        {l.online&&<span className="text-xs px-2 py-0.5 rounded-full border" style={{borderColor:"var(--cy)",color:"var(--cy)"}}>онлайн</span>}
        {l.week!=="both"&&<span className="text-xs" style={{color:"var(--mu)"}}>{l.week==="num"?"чисельник":"знаменник"}</span>}
        {live&&<span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{background:"var(--nw)",color:"#03180f"}}>Зараз іде</span>}</div>
      <div className="font-semibold leading-snug">{l.title}</div>
      <div className="text-sm mt-0.5" style={{color:"var(--mu)"}}>{l.teacher}</div>
      <div className="flex items-center justify-between mt-2 gap-2">
        <span className="text-sm">{l.building==="ВФ"?l.room:`${l.building} н.к., ауд. ${l.room}`}</span>
        {group.maps&&(hasMap?<button onClick={()=>onMap({id:roomId,label:l.room,floor,building:l.building})} className="flex items-center gap-1 text-sm font-semibold px-3 py-1.5 rounded-lg" style={{background:"var(--ac)",color:"#fff"}}><Icon d={I.pin}/>На карті</button>
          :<span className="text-xs" style={{color:"var(--mu)"}}>карти немає</span>)}</div>
      {live&&<div className="mt-2 h-1.5 rounded-full" style={{background:"var(--bd)"}}><div className="h-full rounded-full" style={{width:pct+"%",background:"var(--nw)"}}/></div>}
    </div></li>}

function Schedule({group,now,onBack,onMap}){
  const [list,setList]=useState(null),[day,setDay]=useState(Math.min(now.day,5)===now.day?now.day:0),[sub,setSub]=useState(0);
  const [week,setWeek]=useState(null);
  useEffect(()=>{setList(null);api.getSchedule(group).then(setList)},[group.id]);
  const shown=(list||[]).filter(l=>l.day===day&&(l.week==="both"||l.week===(week||now.week))&&(sub===0||l.sub===0||l.sub===sub)).sort((a,b)=>a.pair-b.pair||a.sub-b.sub);
  const Seg=({v,set,opts})=><div className="flex rounded-lg p-0.5" style={{background:"var(--sf)",border:"1px solid var(--bd)"}}>{opts.map(([k,t])=><button key={k} onClick={()=>set(k)} className="flex-1 px-3 py-1.5 text-sm rounded-md whitespace-nowrap" style={v===k?{background:"var(--ac)",color:"#fff"}:{color:"var(--mu)"}}>{t}</button>)}</div>;
  return <><Header title={group.id} sub="Розклад · 1 курс" onBack={onBack}/>
  <main className="px-4 pb-40 max-w-3xl mx-auto">
    <div className="flex gap-2 overflow-x-auto noscroll pb-2">{DAYS.slice(0,6).map((d,i)=><button key={d} onClick={()=>setDay(i)} className="relative px-4 py-2 rounded-lg text-sm font-semibold" style={day===i?{background:"var(--tx)",color:"var(--bg)"}:{background:"var(--sf)",border:"1px solid var(--bd)"}}>{d}{now.day===i&&<span className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full" style={{background:"var(--nw)"}}/>}</button>)}</div>
    <div className="grid sm:grid-cols-2 gap-2 my-3">
      <Seg v={week||now.week} set={setWeek} opts={[["num","Чисельник"],["den","Знаменник"]]}/>
      <Seg v={sub} set={setSub} opts={[[0,"Вся група"],[1,"1 підгр."],[2,"2 підгр."]]}/></div>
    {!list?<p style={{color:"var(--mu)"}}>Завантаження…</p>:shown.length===0?<p className="card p-4" style={{color:"var(--mu)"}}>Пар немає. Можна відпочити.</p>
     :<ul className="grid gap-3">{shown.map((l,i)=><Lesson key={i} l={l} group={group} now={now} onMap={onMap}/>)}</ul>}
    {list&&(DATA.vns[group.id]||[]).includes(day)&&<p className="mt-3 text-sm" style={{color:"var(--mu)"}}>У цей день є блок ВНС (вибіркові дисципліни) — у розкладі відображається окремо.</p>}
  </main></>}

function MapModal({room,onClose}){
  const key=room.building+"-"+room.floor,full=MAPS[key].match(/viewBox="([^"]*)"/)[1].split(" ").map(Number),host=useRef(),cur=useRef(full),raf=useRef();
  const fly=(to)=>{cancelAnimationFrame(raf.current);const from=cur.current,t0=performance.now(),svg=host.current.querySelector("svg");
    const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
    const step=t=>{let k=reduce?1:Math.min((t-t0)/800,1);k=1-Math.pow(1-k,3);cur.current=from.map((v,i)=>v+(to[i]-v)*k);svg.setAttribute("viewBox",cur.current.join(" "));if(k<1)raf.current=requestAnimationFrame(step)};raf.current=requestAnimationFrame(step)};
  const [miss,setMiss]=useState(false);
  useEffect(()=>{const svg=host.current.querySelector("svg"),g=svg.querySelector("#"+CSS.escape("room_"+room.id));svg.setAttribute("viewBox",full.join(" "));
    if(!g){setMiss(true);return}
    g.classList.add("hl");const b=g.getBBox(),w=full[2]*.3042,h=w*full[3]/full[2];setTimeout(()=>fly([b.x+b.width/2-w/2,b.y+b.height/2-h/2,w,h]),250);
    return()=>cancelAnimationFrame(raf.current)},[room.id]);
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();addEventListener("keydown",k);return()=>removeEventListener("keydown",k)},[]);
  return <div className="fixed inset-0 z-50 flex flex-col" style={{background:"rgba(10,18,44,.94)"}} role="dialog" aria-modal="true">
    <div className="flex items-center justify-between p-4"><div><div className="hd font-bold">Ауд. {room.label}</div><div className="text-sm" style={{color:"var(--mu)"}}>{room.building} н.к. · {room.floor} поверх{miss&&" · ауд. не знайдено на карті"}</div></div>
      <div className="flex gap-2"><button onClick={()=>fly(full)} className="px-3 py-1.5 rounded-lg text-sm card">Весь поверх</button><button onClick={onClose} aria-label="Закрити" className="p-2 rounded-lg card"><Icon d={I.x} c="w-5 h-5"/></button></div></div>
    <div className="flex-1 p-3 min-h-0"><div ref={host} className="mapbox h-full rounded-xl overflow-hidden" dangerouslySetInnerHTML={{__html:MAPS[key]}}/></div></div>}

function App(){
  const [dept,setDept]=useState(null),[group,setGroup]=useState(null),[map,setMap]=useState(null);
  const [tick,setTick]=useState(0);useEffect(()=>{const i=setInterval(()=>setTick(x=>x+1),30000);return()=>clearInterval(i)},[]);
  const d=new Date(),now={day:(d.getDay()+6)%7,min:d.getHours()*60+d.getMinutes(),week:DATA.weekOf(d)};
  return <>{group?<Schedule key={group.id} group={group} now={now} onBack={()=>setGroup(null)} onMap={setMap}/>
    :dept?<Groups dept={dept} onPick={setGroup} onBack={()=>setDept(null)}/>:<Home onPick={setDept}/>}
    {map&&<MapModal room={map} onClose={()=>setMap(null)}/>}
DATA.weekOf=d=>{const w=Math.floor((d-new Date(d.getFullYear()>=2026&&d.getMonth()<8?d.getFullYear()-1:d.getFullYear(),8,1))/6048e5);return w%2?"den":"num"}; // TODO: бекенд має віддавати тип тижня
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
